name: ClosureProof CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, staging, stagging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: closureproof-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Typecheck, unit tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Match repository npm version
        run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Isolated database and desktop/mobile browser tests
    # Forks cannot access the private SQL bundle. They still run quality checks;
    # the final required check stays blocked until tested on a trusted branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: stagging
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Match repository npm version
        run: npm install --global npm@11.6.2
      - run: npm ci
      - name: Restore private SQL fixtures
        run: node scripts/ci-sql-bundle.mjs restore
        env:
          CI_SQL_BUNDLE_1: ${{ secrets.CI_SQL_BUNDLE_1 }}
          CI_SQL_BUNDLE_2: ${{ secrets.CI_SQL_BUNDLE_2 }}
          CI_SQL_BUNDLE_3: ${{ secrets.CI_SQL_BUNDLE_3 }}
          CI_SQL_BUNDLE_4: ${{ secrets.CI_SQL_BUNDLE_4 }}
      - run: npm run test:db
      - name: Install Google Chrome and Linux dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps chrome
      - name: Run isolated browser suite
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  ready:
    name: Ready for review
    if: always()
    needs: [quality, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all checks to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ] || [ "$INTEGRATION_RESULT" != "success" ]; then
            echo 'Build, unit, SQL and browser checks must all pass before review/merge.'
            exit 1
          fi
          echo 'All ClosureProof checks passed.'
